<script>const scenes=[["highmere", "Highmere", "RE-096", "Stone garden terraces flank the royal approach. The keep has an audience chamber beyond its upper landing."], ["fern", "Fern Hollow", "RE-097", "The smithy and provisioner face the village square. The inn sits southeast of the shops, above the stream."], ["alder", "Alderbridge", "RE-099", "The west road branches toward a stone stream crossing. Raised planting beds follow the orchard terraces above the meeting tree."], ["harbor", "Valenne Harbor", "RE-098", "The quay curves into a basin between the two piers. A passenger door beside the cargo opening leads into the bonded warehouse."], ["depths", "Underground remnant", "RE-101", "The smaller device platform stands to the right of the daylight stair, leaving a wider strip of flagstone down the left side."], ["fernGate", "Remnant entrance", "RE-101", "The remnant stair meets the southeastern lane between the inn and the stream."], ["fernCanopyInn", "Fern Hollow Inn", "RE-102", "Three staggered arches open onto private sleeping chambers. Each suite has a bed, a cabinet and its own threshold mat."], ["fernHollowSmithy", "Fern Hollow Smithy", "RE-103", "A leather bellows sits beside the forge. The quenching tub, grinding wheel and finishing bench occupy separate work areas."], ["fernHollowSupplies", "Fern Hollow Supplies", "RE-104", "Side-wall shelves carry ceramics between the windows. The passage beside the provisions counter leads to the stockroom."], ["royalDistrict", "Highmere from the lower town", "RE-096", "The road climbs through the planted wards toward the keep. Houses on the terraces open into town interiors."], ["villageCourt", "Fern Hollow village square", "RE-097", "The shop entrances face the court, with public paths between the commercial buildings and cottages."], ["roadsideCourt", "Alderbridge meeting court", "RE-099", "A stone retaining edge follows the higher ground beyond the meeting circle and working sheds."], ["coastalDistrict", "Valenne waterfront", "RE-098", "The low quay follows the waterline, with the customs house and residences on the higher street."], ["duskVillage", "Fern Hollow at dusk", "RE-097", "Evening light across the remodeled village square."], ["fernBridge", "Fern Hollow stream crossing", "RE-097", "A stream cuts across the southern approach. The road crosses on a crowned masonry bridge with stone parapets."], ["alderBridge", "Alderbridge orchard crossing", "RE-099", "A branch off the western approach crosses the orchard stream and climbs the opposite bank."]],sel=document.querySelector('#view');function show(i){i=(i+scenes.length)%scenes.length;const [key,title,id,note]=scenes[i];sel.selectedIndex=i;document.getElementById('caption').textContent=title+' · '+id+' — '+note;for(const [name,el,link] of [['before','old','oldlink'],['after','fresh','newlink']]){const path=key+'-'+name+'.jpg',img=document.getElementById(el);img.src=path;img.alt=title+' '+name;document.getElementById(link).href=path}history.replaceState(null,'','#'+key)}sel.onchange=()=>show(sel.selectedIndex);document.querySelector('#prev').onclick=()=>show(sel.selectedIndex-1);document.querySelector('#next').onclick=()=>show(sel.selectedIndex+1);show(Math.max(0,scenes.findIndex(s=>s[0]===location.hash.slice(1))));</script></html>
